spring:
  application:
    name: activity-service
  mongodb:
    uri: mongodb://localhost:27017/fitnessactivity
  rabbitmq:
    host: localhost        # ✅ space after colon
    port: 5672             # ✅ space after colon
    username: guest        # ✅ space after colon
    password: guest        # ✅ space after colon

rabbitmq:
  exchange:
    name: fitness.exchange
  queue:
    name: activity.queue
  routing:
    key: activity.tracking

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true          # ✅ register with IP instead of hostname
    ip-address: 127.0.0.1            # ✅ force localhost IP